[package]
name = "perp-arb-market-data"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
perp-arb-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
httpdate = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "io-util"] }


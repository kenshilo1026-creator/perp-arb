[workspace]
members = ["crates/core", "crates/replay", "crates/market-data", "crates/private-events", "crates/aster-private", "crates/hyperliquid-private", "crates/execution", "crates/order-test"]
resolver = "2"

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
rust_decimal = { version = "1.40", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true


[package]
name = "perp-arb-binance-spot"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
perp-arb-core = { path = "../core" }
perp-arb-private-events = { path = "../private-events" }
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "test-util"] }

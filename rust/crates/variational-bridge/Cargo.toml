[package]
name = "perp-arb-variational-bridge"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
perp-arb-core = { path = "../core" }
perp-arb-execution = { path = "../execution" }
perp-arb-private-events = { path = "../private-events" }
perp-arb-order-test = { path = "../order-test" }
perp-arb-market-data = { path = "../market-data" }
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[package]
name = "perp-arb-hyperliquid-private"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
perp-arb-private-events = { path = "../private-events" }
serde_json.workspace = true
serde.workspace = true
perp-arb-core = { path = "../core" }
k256 = { version = "0.13.4", features = ["ecdsa"] }
sha3 = "0.10"
hex = "0.4"
zeroize = "1"
rmp-serde = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
httpdate = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "io-util"] }
perp-arb-core = { path = "../core" }

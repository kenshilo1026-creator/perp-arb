[package]
name = "perp-arb-spot-perp"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
perp-arb-core = { path = "../core" }
perp-arb-market-data = { path = "../market-data" }
perp-arb-binance-spot = { path = "../binance-spot" }
perp-arb-private-events = { path = "../private-events" }
perp-arb-order-test = { path = "../order-test" }
perp-arb-execution = { path = "../execution" }
sha2 = "0.10.9"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[[bin]]
name = "spot-perp"
path = "src/main.rs"
